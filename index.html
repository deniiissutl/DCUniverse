<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Universe | Fase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--surface:#0d1424;--line:#1c2740;--text:#eef2f8;--muted:#9aa8c0;
--ui:'Barlow Condensed','Arial Narrow',sans-serif;--read:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;
background:radial-gradient(60% 45% at 15% 0%,rgba(242,182,50,.10),transparent 70%),radial-gradient(55% 45% at 90% 5%,rgba(74,163,255,.10),transparent 70%),var(--bg)}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.35}
.wrap{position:relative;max-width:1320px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,3vw,40px) 28px}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:clamp(22px,3.5vw,40px)}
h1{font-weight:800;font-size:clamp(3rem,9vw,6.5rem);line-height:.88;letter-spacing:.06em}
.sub{margin-top:14px;font-size:1.2rem;font-weight:500;color:var(--muted);letter-spacing:.03em}
.rule{display:flex;height:4px;width:min(320px,70%);margin-top:18px;border-radius:2px;overflow:hidden}
.rule i{flex:1}
.status{text-align:right;font-size:1.15rem;font-weight:600;color:var(--muted)}
.status b{display:block;font-size:2rem;font-weight:700;color:var(--text);line-height:1.1}
.grid{display:grid;gap:clamp(14px,2vw,26px);grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:10px;overflow:hidden;
border:1px solid color-mix(in srgb,var(--a) 28%,var(--line));transition:opacity .25s,transform .25s,box-shadow .25s;
animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*90ms)}
.card.live{border-color:color-mix(in srgb,var(--a) 70%,transparent);box-shadow:0 22px 50px -26px var(--a)}
.card:hover{transform:translateY(-4px)}
.grid:has(.card:hover) .card:not(:hover){opacity:.55}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;
background:radial-gradient(110% 70% at 50% 0%,color-mix(in srgb,var(--a) 38%,transparent),transparent 65%),linear-gradient(#111a2e,#0a101d)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.card.soon .poster img{filter:grayscale(.55) brightness(.75)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#070b14 0%,rgba(7,11,20,.88) 24%,transparent 58%)}
.yr{position:absolute;top:30%;left:0;right:0;text-align:center;font-weight:800;font-size:clamp(4.5rem,9vw,7rem);
color:color-mix(in srgb,var(--a) 22%,transparent);letter-spacing:.04em}
.chip{position:absolute;z-index:2;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;
border-radius:99px;background:rgba(7,11,20,.78);backdrop-filter:blur(6px);font-size:1rem;font-weight:600;letter-spacing:.03em;
border:1px solid color-mix(in srgb,var(--a) 55%,transparent)}
.live .chip{color:var(--a)}.soon .chip{color:var(--muted)}
.chip svg{width:13px;height:13px;fill:currentColor}
.meta{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:18px}
h2{font-weight:800;font-size:clamp(1.9rem,2.6vw,2.4rem);line-height:1;letter-spacing:.05em}
.meta p{margin-top:8px;font:italic 400 .95rem/1.4 var(--read);color:#cbd5e6}
.actions{display:flex;gap:8px;padding:14px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:6px;
font:700 1.15rem var(--ui);letter-spacing:.06em;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:filter .2s,background .2s}
.btn svg{width:15px;height:15px;fill:currentColor}
.go{flex:1}
.go::after{content:"";position:absolute;inset:0;z-index:1}
a.go{background:var(--a);color:#07101a}
a.go:hover{filter:brightness(1.12)}
.ghost{background:transparent;color:var(--text);border-color:var(--line);position:relative;z-index:2}
.ghost:hover{background:rgba(255,255,255,.06);border-color:var(--muted)}
.soon .go.ghost{color:var(--a);border-color:color-mix(in srgb,var(--a) 50%,transparent)}
footer{margin-top:26px;font-size:1.05rem;color:var(--muted);letter-spacing:.02em}
dialog{margin:auto;width:min(760px,calc(100% - 24px));max-height:88vh;padding:0;border:1px solid var(--line);border-radius:12px;background:#0b1120;color:var(--text);overflow:hidden}
dialog::backdrop{background:rgba(3,6,12,.78);backdrop-filter:blur(8px)}
dialog[open]{animation:rise .3s ease-out}
.d-head{display:flex;justify-content:space-between;gap:16px;padding:22px 24px 18px;border-bottom:1px solid var(--line);
background:linear-gradient(135deg,color-mix(in srgb,var(--a) 20%,transparent),transparent 60%)}
.d-head h3{font-size:2.3rem;font-weight:800;letter-spacing:.05em;line-height:1}
.d-head p{margin-top:8px;color:var(--muted);font:italic 1rem var(--read)}
.x{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:1.4rem}
.x:hover{background:rgba(255,255,255,.08)}
.d-body{padding:22px 24px 26px;overflow-y:auto;max-height:calc(88vh - 110px);display:grid;gap:22px}
.d-body h4{font-size:1.25rem;font-weight:700;letter-spacing:.06em;color:var(--a);margin-bottom:10px}
.syn p{font:400 1.02rem/1.7 var(--read);max-width:68ch;color:#d8e0ee}
.syn p+p{margin-top:12px}.syn strong{color:var(--text)}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.who{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.av{position:relative;flex:none;width:52px;height:64px;border-radius:6px;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:1.3rem;
color:var(--a);background:color-mix(in srgb,var(--a) 16%,#0f1626);border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.who b{display:block;font-size:1.1rem;font-weight:700;line-height:1.15}
.who span{display:block;font-size:1rem;color:var(--a);font-weight:600}
.who small{display:block;font:400 .85rem/1.35 var(--read);color:var(--muted);margin-top:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div>
      <h1>DC UNIVERSE</h1>
      <p class="sub">Fase 1, de 2012 a 2014</p>
      <div class="rule" id="rule" aria-hidden="true"></div>
    </div>
    <div class="status" id="status"></div>
  </header>
  <main class="grid" id="grid"></main>
  <footer>Elige un proyecto jugable para empezar. En cada título puedes abrir el dossier con sinopsis y reparto.</footer>
</div>
<dialog id="dossier" aria-labelledby="d-title"></dialog>

<script>
/* ==========================================================================
   PROYECTOS (editable)
   - urlArchivo: archivo .html del juego. Con estado 'DISPONIBLE' y una ruta, el proyecto es jugable.
   - imagenPoster / reparto[].imagen: ruta de la imagen. Si está vacía o no carga, se muestra un
     recuadro con el color del proyecto (o las iniciales del personaje).
   - colorAcento: 'amber' | 'emerald' | 'rose' | 'sky'
   ========================================================================== */
const CONFIG_PROYECTOS = [
            {

                    'El regreso y la leyenda: En 2012, un Bruce de 30 años (Armie Hammer, 1,96m) regresa tras entrenar con Henri Ducard / Ra\'s al Ghul (Alexander Siddig). Tras recibir un disparo en su primera noche sin traje, acude a Lucius Fox (Giancarlo Esposito) para obtener el traje de Kevlar/carbono y el Batmóvil militar.',
                    'Corrupción y Enygma: Detiene un trato de armas del Pingüino (Alfred Molina) en los muelles y sella un pacto en la azotea con Jim Gordon (Jon Hamm). Cuando Edward Nygma (David Tennant) hackea la ciudad, asalta el museo y revela desde su guarida bajo la comisaría que conoce la identidad de Bruce, Batman escapa fingiendo golpear a Gordon y derrota a Nygma en Ace Chemicals.',
                    'Post-créditos (2014): Alfred le muestra a Bruce el periódico con el debut de Superman en Metrópolis y descubren la fotografía de Diana en 1944.'
                ],
                reparto: [
                    { nombre: 'Bruce Wayne / Batman', actor: 'Armie Hammer (30 años)', rol: '1,96m • Depredador analítico', imagen: 'Imagenes/batman_icon.jpg' },
                    { nombre: 'Alfred Pennyworth', actor: 'Anton Lesser (55 años)', rol: 'Estratega logístico en la Batcueva', imagen: 'Imagenes/alfred_icon.jfif' },
                    { nombre: 'Jim Gordon', actor: 'Jon Hamm (36 años)', rol: 'Aliado policial en el GCPD', imagen: 'Imagenes/gordon_icon.jpg' },
                    { nombre: 'Lucius Fox', actor: 'Giancarlo Esposito (54 años)', rol: 'Contabilidad fantasma e I+D', imagen: 'Imagenes/fox_icon.jpeg' },
                    { nombre: 'Edward Nygma / El Acertijo', actor: 'David Tennant (41 años)', rol: 'Terrorista intelectual narcisista', imagen: 'Imagenes/acertijo_icon.jpeg' },
                    { nombre: 'Oswald Cobblepot / El Pingüino', actor: 'Alfred Molina (59 años)', rol: 'Aristócrata mafioso de los muelles', imagen: 'Imagenes/pinguino_icon.jpg' },
                    { nombre: 'Henri Ducard / Ra\'s al Ghul', actor: 'Alexander Siddig (47 años)', rol: 'Maestro de la Liga de las Sombras', imagen: 'Imagenes/ras_icon.jpeg' }
                ]
            },
            {
                id: 'green_lantern',
                tituloCorto: 'proximamente',
                tituloOficial: 'GREEN LANTERN (2012)',
                subtitulo: 'El Guardián del Sector 2814',
                estado: 'DISPONIBLE',
                etiquetaSuperior: 'PROYECTO 02 • JUGABLE',
                urlArchivo: 'green_lantern_sector_2814_dcu_nv_v04.html', // <-- Juego de Green Lantern
                imagenPoster: 'Imagenes/greenlantern_poster.jpg', // <-- Imagen en blanco (#FFFFFF) lista para tu póster
                colorAcento: 'emerald',
                icono: 'fa-ring',
                resumenCorto: 'Reclutado en 2007 y entrenado por Thaal Sinestro (Mark Strong), Hal Jordan (Chris Pine) descubre en 2012 la dictadura de su mentor en Korugar y se enfrenta al primer Anillo Amarillo.',
                sinopsisCompleta: [
                    'El origen del anillo (2007): Abin Sur se estrella en la Tierra y su anillo elige a Hal Jordan (Chris Pine, 32 años), un piloto de pruebas brillante, temerario y arrogante. En Oa, es entrenado por el condecorado y estricto Thaal Sinestro (Mark Strong, 49 años).',
                    'La dictadura en Korugar (2012): Cinco años después, Hal es un veterano endurecido en el espacio profundo. Al desviarse hacia Korugar, descubre que Sinestro ha instaurado una dictadura militar perfecta basada en el orden absoluto y el terror.',
                    'El gran giro y el Anillo Amarillo: Expuesto ante los Guardianes en Oa, Sinestro asesina a sangre fría a un Guardián, escapa al universo de antimateria de Qward y forja el primer Anillo Amarillo alimentado por el miedo.',
                    'Clímax: Hal comprende que la verdadera voluntad es aceptar y superar el miedo, quebrando las construcciones amarillas de Sinestro y encerrándolo en Oa mientras la Tierra sigue ignorando que no está sola.'
                ],
                reparto: [
                    { nombre: 'Hal Jordan / Green Lantern', actor: 'Chris Pine (32 años)', rol: 'Piloto temerario • Protector del Sector 2814', imagen: '' },
                    { nombre: 'Thaal Sinestro', actor: 'Mark Strong (49 años)', rol: 'Antiguo mentor y portador del Anillo Amarillo', imagen: '' }
                ]
            },
            {
                id: 'wonder_woman',
                tituloCorto: 'proximamente',
                tituloOficial: 'WONDER WOMAN (2013)',
                subtitulo: 'La Guerrera de 1944 y el Silencio de 70 Años',
                estado: 'PRÓXIMAMENTE',
                etiquetaSuperior: 'PRÓXIMAMENTE • PROYECTO 03',
                urlArchivo: '', // <-- Cuando crees el juego de Wonder Woman, pon aquí su archivo .html
                imagenPoster: 'Imagenes/wonderwoman_poster.jfif', // <-- Imagen en blanco (#FFFFFF) lista para tu póster
                colorAcento: 'rose',
                icono: 'fa-shield-halved',
                resumenCorto: 'Moldeada en arcilla por la Reina Hipólita (Lucy Lawless), Diana (Gal Gadot) viaja a la Segunda Guerra Mundial en 1944 junto a Steve Trevor (Charlie Hunnam) frente a Ares y Hades (Mads Mikkelsen).',
                sinopsisCompleta: [
                    'El origen de la arcilla y 1944: Moldeada en arcilla en Themyscira por la Reina Hipólita (Lucy Lawless) y dotada de vida por los dioses, Diana (Gal Gadot) rescata en 1944 al piloto y espía aliado Steve Trevor (Charlie Hunnam, 33 años) cuando su avión atraviesa la barrera mágica.',
                    'El viaje al frente sin retorno: Convencida de que Ares manipula la Segunda Guerra Mundial, Diana roba la armadura sagrada y abandona Themyscira para siempre. En las trincheras, el dios del inframundo Hades (Mads Mikkelsen) observa en traje sastre la cosecha de almas con elegancia gélida.',
                    'El gran giro y el sacrificio: Al matar al general que creía que era Ares, la guerra no se detiene: el verdadero Ares revela que él solo dio las ideas de las armas; la humanidad eligió la masacre. Mientras Diana derrota a Ares en el barro, Steve Trevor se sacrifica pilotando el bombardero con gas letal hacia la atmósfera.',
                    'El exilio en las sombras: Desilusionada con la humanidad y rota por la pérdida de Steve, Diana borra todo rastro y vive 70 años en el anonimato hasta ser captada por el software de Bruce Wayne en 2014.'
                ],
                reparto: [
                    { nombre: 'Diana / Wonder Woman', actor: 'Gal Gadot', rol: 'Princesa Amazona de Themyscira', imagen: 'Imagenes/wonderwoman_icon.jpg' },
                    { nombre: 'Steve Trevor', actor: 'Charlie Hunnam (33 años)', rol: 'Piloto y espía aliado en 1944', imagen: '' },
                    { nombre: 'Reina Hipólita', actor: 'Lucy Lawless', rol: 'Gobernante guerrera de Themyscira', imagen: '' },
                    { nombre: 'Hades', actor: 'Mads Mikkelsen', rol: 'Señor del Inframundo • Estratega de almas', imagen: '' }
                ]
            },
            {
                id: 'superman',
                tituloCorto: 'proximamente',
                tituloOficial: 'SUPERMAN (2014)',
                subtitulo: 'El Símbolo de Esperanza en Metrópolis',
                estado: 'PRÓXIMAMENTE',
                etiquetaSuperior: 'PRÓXIMAMENTE • PROYECTO 04',
                urlArchivo: '', // <-- Cuando crees el juego de Superman, pon aquí su archivo .html
                imagenPoster: 'Imagenes/superman_poster.jfif', // <-- Imagen en blanco (#FFFFFF) lista para tu póster
                colorAcento: 'sky',
                icono: 'fa-sun',
                resumenCorto: 'Clark Kent (Matt Bomer) se revela ante el mundo salvando Metrópolis del desastre de Lex Luthor (Michael Fassbender) y enfrentándose a John Corben / Metallo (Joel Kinnaman) junto a Lois Lane.',
                sinopsisCompleta: [
                    'El símbolo de Martha Kent: Tras la caída de Krypton y su juventud en Smallville, Jonathan y Martha Kent le entregan un traje cosido con las mantas indestructibles de su nave: debe ser un símbolo de esperanza a plena luz del día.',
                    'La revelación en Metrópolis (2014): Clark (Matt Bomer, 27 años) llega al Daily Planet junto a la incisiva Lois Lane (Mary Elizabeth Winstead, 29 años) en una ciudad hipnotizada por Lex Luthor (Michael Fassbender, 37 años). Cuando una demostración de LexCorp colapsa, Clark vuela frente a miles de cámaras y salva la ciudad.',
                    'La creación de Metallo: Humillado en su ego narcisista, Luthor utiliza al Dr. Emmett Vale para transferir la mente de su jefe de seguridad herido, John Corben (Joel Kinnaman, 34 años), a un exoesqueleto impulsado por Kryptonita. Lex asesina a Vale y manipula a un Corben privado de sus sentidos humanos para culpar a Superman.',
                    'Clímax y conexión con la Trinidad: Superman supera el dolor agonizante de la radiación verde para desmantelar a Metallo protegiendo a los civiles. En la escena post-créditos, Bruce Wayne y Alfred observan la pelea en la Batcueva y descubren a Diana entre la multitud de Metrópolis.'
                ],
                reparto: [
                    { nombre: 'Clark Kent / Superman', actor: 'Matt Bomer (27 años)', rol: 'El Hombre de Acero • Reportero del Daily Planet', imagen: 'Imagenes/superman_icon.jpg' },
                    { nombre: 'Lex Luthor', actor: 'Michael Fassbender (37 años)', rol: 'CEO de LexCorp • Narcisista tecnológico', imagen: '' },
                    { nombre: 'John Corben / Metallo', actor: 'Joel Kinnaman (34 años)', rol: 'Ex-jefe de seguridad con núcleo de Kryptonita', imagen: '' },
                    { nombre: 'Lois Lane', actor: 'Mary Elizabeth Winstead (29 años)', rol: 'Reportera estrella del Daily Planet', imagen: '' }
                ]
            }
        ];

const ACCENTS = { amber:'#f2b632', emerald:'#2ee082', rose:'#ee4a5a', sky:'#4aa3ff' };
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg>';
const LOCK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 118 0v2h1v8H3V7zm2 0h4V5a2 2 0 10-4 0z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = p => ACCENTS[p.colorAcento] || ACCENTS.amber;
const playable = p => p.estado === 'DISPONIBLE' && p.urlArchivo.trim() !== '';
const parts = p => { const m = p.tituloOficial.match(/^(.*?)\s*\((\d{4})\)$/); return m ? {name:m[1], year:m[2]} : {name:p.tituloOficial, year:''}; };
const initials = n => n.split(/[\s\/]+/).filter(Boolean).slice(0,2).map(w => w[0]).join('');
const poster = p => p.imagenPoster ? `<img src="${esc(p.imagenPoster)}" alt="" onerror="this.remove()">` : '';

function card(p, i) {
  const ok = playable(p), {name, year} = parts(p);
  return `<article class="card ${ok ? 'live' : 'soon'}" style="--a:${color(p)};--i:${i}">
    <div class="poster"><span class="yr" aria-hidden="true">${year}</span>${poster(p)}
      <span class="chip">${ok ? PLAY + 'Jugable' : LOCK + 'Próximamente'}</span>
      <div class="meta"><h2>${esc(name)}</h2><p>${esc(p.subtitulo)}</p></div>
    </div>
    <div class="actions">${ok
      ? `<a class="btn go" href="${esc(p.urlArchivo)}">${PLAY}Jugar</a><button type="button" class="btn ghost" data-dossier="${p.id}" aria-label="Dossier de ${esc(name)}">Dossier</button>`
      : `<button type="button" class="btn ghost go" data-dossier="${p.id}">Ver dossier</button>`}</div>
  </article>`;
}

function dossier(p) {
  const ok = playable(p);
  const syn = p.sinopsisCompleta.map(t => { const k = t.indexOf(': ');
    return k > 0 && k < 60 ? `<p><strong>${esc(t.slice(0,k))}.</strong> ${esc(t.slice(k+2))}</p>` : `<p>${esc(t)}</p>`; }).join('');
  const cast = p.reparto.map(r => `<div class="who"><span class="av">${esc(initials(r.nombre))}${r.imagen ? `<img src="${esc(r.imagen)}" alt="" onerror="this.remove()">` : ''}</span>
    <div><b>${esc(r.nombre)}</b><span>${esc(r.actor)}</span><small>${esc(r.rol)}</small></div></div>`).join('');
  return `<div style="--a:${color(p)}">
    <div class="d-head"><div><h3 id="d-title">${esc(p.tituloOficial)}</h3><p>${esc(p.subtitulo)}</p></div>
      <button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="d-body">
      ${ok ? `<a class="btn go" style="background:var(--a);color:#07101a;position:static" href="${esc(p.urlArchivo)}">${PLAY}Jugar ahora</a>` : ''}
      <section><h4>Resumen</h4><div class="syn"><p>${esc(p.resumenCorto)}</p></div></section>
      <section><h4>Historia</h4><div class="syn">${syn}</div></section>
      <section><h4>Reparto (${p.reparto.length})</h4><div class="cast">${cast}</div></section>
    </div></div>`;
}

const grid = document.getElementById('grid'), dlg = document.getElementById('dossier');
grid.innerHTML = CONFIG_PROYECTOS.map(card).join('');
document.getElementById('rule').innerHTML = CONFIG_PROYECTOS.map(p => `<i style="background:${color(p)}"></i>`).join('');
const live = CONFIG_PROYECTOS.filter(playable).length, soon = CONFIG_PROYECTOS.length - live;
document.getElementById('status').innerHTML = `<b>${live} ${live === 1 ? 'jugable' : 'jugables'}</b>${soon} en desarrollo`;

grid.addEventListener('click', e => {
  const b = e.target.closest('[data-dossier]'); if (!b) return;
  dlg.innerHTML = dossier(CONFIG_PROYECTOS.find(p => p.id === b.dataset.dossier));
  dlg.showModal();
});
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });

/* Partículas de fondo (se desactivan con "reducir movimiento") */
(function () {
  const c = document.getElementById('bg'), x = c.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let w, h; const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; }; size(); addEventListener('resize', size);
  const ps = Array.from({length:45}, () => ({x:Math.random()*w, y:Math.random()*h, r:.8+Math.random()*1.6, v:.2+Math.random()*.4, a:.2+Math.random()*.5}));
  (function loop() {
    x.clearRect(0,0,w,h);
    for (const p of ps) { x.fillStyle = `rgba(238,242,248,${p.a})`; x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill(); p.y -= p.v; if (p.y < -5) { p.y = h + 5; p.x = Math.random()*w; } }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
